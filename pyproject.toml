[project]
name = "ai-agent-py"
version = "0.1.0"
description = "Learning AI Agents with Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai>=2.73.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentkit"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.6",
]
